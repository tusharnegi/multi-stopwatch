<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Stopwatch</title>
  <meta name="description" content="Timers that keep running, even when this is closed.">
  <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" id="favicon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="bar">
        <span class="label">Today · <span id="date"></span></span>
        <span class="tools">
          <label class="switch" title="Starting one timer pauses the others">
            <input type="checkbox" id="solo"> One at a time
          </label>
          <button type="button" id="pop" hidden title="Floating mini window (P)">Pop out</button>
          <button type="button" id="install" hidden>Install</button>
        </span>
      </div>
      <div class="summary">
        <div id="total" class="total">0:00</div>
        <div id="week" class="week" aria-label="Last 7 days"></div>
      </div>
      <div id="timeline" class="timeline" aria-hidden="true"></div>
      <div class="ends"><span id="from"></span><span>now</span></div>
    </header>

    <div id="away" class="away" hidden>
      <span id="awayText"></span>
      <span class="away-actions">
        <button type="button" id="awayDrop">Remove away time</button>
        <button type="button" id="awayKeep">Keep it</button>
      </span>
    </div>

    <form id="add" autocomplete="off">
      <input id="q" type="text" placeholder="What are you working on?" enterkeyhint="go" aria-label="Start a timer" title="Add a duration like 25m to backdate" maxlength="60">
      <kbd>/</kbd>
    </form>

    <ul id="list" class="list"></ul>

    <p class="hint"><kbd>/</kbd> new <kbd>1</kbd>–<kbd>9</kbd> switch <kbd>Space</kbd> pause / resume <kbd>+</kbd><kbd>−</kbd> 5 min</p>
  </main>

  <div id="toast" class="toast" hidden><span id="toastText"></span><button type="button" id="undo">Undo</button></div>
  <script src="app.js"></script>
</body>
</html>
